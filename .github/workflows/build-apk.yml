name: Build Android APK

# Builds a fully standalone (offline) APK on every push to main (and via manual
# dispatch) and uploads it as a downloadable GitHub Actions artifact. The heavy
# lifting — the actual Gradle/APK compilation — happens here on GitHub runners,
# never locally. The JS bundle is pre-built and embedded so the APK needs no
# Metro dev server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "true"

      # The Android Gradle plugin skips JS bundling for debuggable variants, so a
      # plain `assembleDebug` ships without a JS bundle (red "Unable to load
      # script" screen). Pre-bundle the JS + assets offline with Expo's embed
      # command (the same one the plugin uses for release) so the APK is fully
      # standalone and needs no Metro server.
      - name: Bundle JS + assets offline (standalone APK)
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android
          ls -la android/app/src/main/assets
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "true"

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
