name: Build Android APK

# Builds a release APK on every push to main (and via manual dispatch) and
# uploads it as a downloadable GitHub Actions artifact. The heavy lifting — the
# actual Gradle/APK compilation — happens here on GitHub runners, never locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "true"

      # Expo's generated release build signs with the *debug* keystore
      # (buildTypes.release -> signingConfigs.debug -> android/app/debug.keystore).
      # That file is only auto-created when a debug build runs, so assembleRelease
      # fails on a fresh runner. Generate the standard Android debug keystore here
      # so the release APK signs cleanly and stays installable — no manual secret.
      - name: Generate debug keystore (required to sign the release APK)
        run: keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, OU=Android, O=Android, L=Mountain View, ST=California, C=US"

      - name: Build release APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
