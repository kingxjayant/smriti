name: Build Android APK

# Builds a fully standalone (offline) release APK on every push to main (and via
# manual dispatch) and uploads it as a downloadable GitHub Actions artifact. The
# heavy lifting — the actual Gradle/APK compilation — happens here on GitHub
# runners, never locally. The React Native Gradle plugin bundles the JavaScript
# offline automatically during assembleRelease, so the APK needs no Metro server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "true"

      # assembleRelease bundles AND signs the JS offline (via the RN Gradle
      # plugin's createBundleReleaseJsAndAssets) for a fully standalone APK. The
      # release build signs with signingConfigs.debug (android/app/debug.keystore),
      # which is only created when a debug build runs — so we build debug first to
      # generate the keystore, then build the release APK.
      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
