name: Build Android APK

# Builds an installable APK on every push to main (and via manual dispatch) and
# uploads it as a downloadable GitHub Actions artifact. The heavy lifting — the
# actual Gradle/APK compilation — happens here on GitHub runners, never locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "true"

      # assembleDebug is auto-signed by the Android Gradle Plugin, which generates
      # its own debug keystore — no external keystore or secret is required.
      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
